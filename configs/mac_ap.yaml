# Mac configuration for the ap30 target (Apple Silicon / MPS, ~/Projects/GeoIndex).
#
# Mirror of server_ap.yaml for running sweeps (e.g. CV5) directly on the Mac:
# same indices, per-target stats cache and cv_dir; only the device and the
# absolute roots differ. The ~/Projects/GeoIndex tree is cloud-synced with the
# GPU server, so results written here appear on the server and vice versa —
# do NOT run the same experiment name on both machines at once.
#
# Prereq:  conda activate geoindex

defaults:
  - local
  - _self_

environment:
  device: "mps"
  data_root: "/Users/eunsupark/Projects/GeoIndex/datasets"
  save_root: "/Users/eunsupark/Projects/GeoIndex/results"
  num_workers: 2

# CV fold index directory (ap labels), used by configs/cv/fold*.yaml.
cv_dir: "cv5_ap"

mcd:
  num_mc_samples: 100
  create_plots: false

data:
  timeseries:
    train_index: "total_ap/train_index.csv"
    validation_index: "total_ap/validation_index.csv"
    test_index: "total_ap/validation_index.csv"
    # Per-target stats cache (see server_ap.yaml note).
    stat_file: "table_stats_ap.pkl"

# Batch sweeps: skip per-sample validation plots (plots.zip is ~0.5–1.5 GB per
# run and pollutes the cloud-synced results tree; regenerate on demand for a
# selected model only).
validation:
  save_plots: false
