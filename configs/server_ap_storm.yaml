# Storm-only variant of the direct ap sweep (server_ap).
#
# Identical io grid, models, loss, seed and validation split, but the
# TRAINING set keeps only anchors whose target window contains at least
# one point of ap30 >= 48 (Kp >= 5, NOAA G1 minor-storm boundary) — the
# filter is window-aware, so each io config selects against its own
# target length. Validation stays the full index and the normalization
# stats are the shared table_stats_ap.pkl, so results are directly
# comparable with the ap_ sweep.
#
# Experiment naming: runners prefix experiments from this profile with
# "ap_storm_" (e.g. ap_storm_in12h_out6h_gnn_transformer).
#
# Launch (GPU server):
#   ./train.sh --config-name server_ap_storm --max-jobs 4
#   (the short-horizon io filter is applied automatically by train.sh)

defaults:
  - server_ap
  - _self_

data:
  timeseries:
    train_filter:
      peak_min: 48.0
